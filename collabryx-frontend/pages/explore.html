<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Explore Projects · Collabryx</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/script.js"></script>
</head>
<body>
  <div id="sidebar-container"></div>

  <div class="container">
    <main class="main">
      <h1>Explore Projects</h1>
      <p>Discover and collaborate on exciting ideas from your community.</p>

      <!-- Suggested for You -->
      <div id="suggestionsSection" style="display:none; margin-bottom:32px;">
        <h2 style="font-size:18px; margin-bottom:12px; background:linear-gradient(135deg,#a78bfa,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">✨ Suggested for You</h2>
        <div id="suggestionsContainer" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px;"></div>
        <hr style="margin-top:28px; border-color:#1e293b;">
      </div>

      <h2 style="font-size:18px; margin-bottom:12px; color:#94a3b8;">All Projects</h2>
      <div class="explore-cards" id="ideasContainer" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; margin-top:8px;">
        <div class="loading-message">Loading ideas...</div>
      </div>
    </main>
  </div>

  <script>
window.onload = function () {
  loadSuggestions();
  loadIdeas();
};

async function loadSuggestions() {
  const token = localStorage.getItem("token");
  if (!token) return;

  try {
    const res = await fetch("https://collabryx.onrender.com/api/ideas/suggestions", {
      headers: { "Authorization": "Bearer " + token }
    });
    const ideas = await res.json();
    if (!ideas.length) return;

    document.getElementById("suggestionsSection").style.display = "block";
    const container = document.getElementById("suggestionsContainer");
    container.innerHTML = "";

    ideas.forEach(idea => {
      const skillsHTML = (idea.requiredSkills || [])
        .map(skill => `<span class="skill-badge" style="background:rgba(167,139,250,0.15); color:#a78bfa;">${skill}</span>`)
        .join("");

      const card = document.createElement("div");
      card.className = "idea-card";
      card.style.border = "1px solid rgba(167,139,250,0.3)";
      card.innerHTML = `
        <div class="idea-card-header">
          <h3 class="idea-card-title">${idea.title}</h3>
          <p class="idea-card-creator">Created by ${idea.createdBy?.name || "User"}</p>
        </div>
        <p class="idea-card-description">${idea.description}</p>
        <div>
          <div class="idea-skills-label">Skills Match</div>
          <div class="idea-skills">${skillsHTML}</div>
        </div>
        <div class="idea-card-buttons">
          <button class="apply-btn" onclick="applyProject('${idea._id}')">🚀 Apply</button>
        </div>
      `;
      container.appendChild(card);
    });
  } catch (err) {
    console.log("Suggestions error:", err);
  }
}

async function loadIdeas() {
  const container = document.getElementById("ideasContainer");

  try {
    const res = await fetch("https://collabryx.onrender.com/api/ideas");
    const ideas = await res.json();

    container.innerHTML = "";

    if (ideas.length === 0) {
      container.innerHTML = "<p class='empty-message'>No ideas available</p>";
      return;
    }

    ideas.forEach(idea => {
      const card = document.createElement("div");
      card.className = "idea-card";

      const skillsHTML = (idea.requiredSkills || [])
        .map(skill => `<span class="skill-badge">${skill}</span>`)
        .join("");

      card.innerHTML = `
        <div class="idea-card-header">
          <h3 class="idea-card-title">${idea.title}</h3>
          <p class="idea-card-creator">Created by ${idea.createdBy?.name || "User"}</p>
        </div>

        <p class="idea-card-description">${idea.description}</p>

        <div>
          <div class="idea-skills-label">Skills Required</div>
          <div class="idea-skills">${skillsHTML}</div>
        </div>

        <div class="idea-card-buttons">
          <button class="apply-btn" onclick="applyProject('${idea._id}')">
            🚀 Apply
          </button>
        </div>
      `;

      container.appendChild(card);
    });

  } catch (error) {
    console.log("Error:", error);
    container.innerHTML = "<p class='empty-message'>Error loading ideas</p>";
  }
}

async function applyProject(ideaId) {
  try {
    const res = await fetch(`https://collabryx.onrender.com/api/request/apply/${ideaId}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + localStorage.getItem("token")
      }
    });

    const data = await res.json();
    alert("Applied successfully 🚀");

  } catch (error) {
    console.log("Error:", error);
  }
}
  </script>

  <script src="../js/sidebar-loader.js"></script>
</body>
</html>
