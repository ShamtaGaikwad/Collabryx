<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Faculty Monitor · Collabryx</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .faculty-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .faculty-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 28px 24px 24px;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .faculty-card:hover {
      transform: translateY(-8px);
      border-color: rgba(124,58,237,0.45);
      box-shadow: 0 20px 50px rgba(124,58,237,0.15);
    }

    /* Avatar circle with gradient ring */
    .faculty-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 16px;
      box-shadow: 0 0 0 4px rgba(124,58,237,0.2), 0 8px 24px rgba(124,58,237,0.3);
      flex-shrink: 0;
    }

    .faculty-name {
      font-size: 17px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
    }

    .faculty-role-badge {
      display: inline-block;
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.3);
      color: #c4b5fd;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .faculty-desc {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 14px;
      flex-grow: 1;
    }

    .faculty-expertise {
      display: inline-block;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      color: #a5b4fc;
      padding: 5px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .faculty-email {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 18px;
      word-break: break-all;
    }

    .faculty-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(124,58,237,0.3);
      letter-spacing: 0.3px;
    }

    .faculty-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(124,58,237,0.5);
    }

    /* divider line */
    .faculty-divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      border-radius: 2px;
      margin: 0 auto 14px;
    }
  </style>
</head>
<body>

<div id="sidebar-container"></div>

<div class="container">
  <div class="main">
    <h1>Faculty Profiles</h1>
    <p>Browse the teaching staff and their expertise</p>

    <div id="facultyContainer" class="faculty-grid"></div>
  </div>
</div>

<script>
console.log("Script running...");

// Avatar initials helper
function getInitials(name) {
  return name ? name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) : '👤';
}

async function loadFaculty() {
  try {
    console.log("Fetching faculty...");

    const res = await fetch("http://localhost:5000/api/faculty");
    const data = await res.json();

    console.log("Data received:", data);

    const container = document.getElementById("facultyContainer");

    if (!container) {
      console.log("Container not found ❌");
      return;
    }

    container.innerHTML = "";

    data.forEach(faculty => {
      container.innerHTML += `
        <div class="faculty-card">
          <div class="faculty-avatar">${getInitials(faculty.name)}</div>
          <div class="faculty-name">${faculty.name}</div>
          <div class="faculty-role-badge">Faculty Member</div>
          <div class="faculty-divider"></div>
          <p class="faculty-desc">${faculty.description || "No description available"}</p>
          <span class="faculty-expertise">🎓 ${faculty.expertise || "General"}</span>
          <p class="faculty-email">✉️ ${faculty.email}</p>
          <button class="faculty-btn">📩 Request Faculty</button>
        </div>
      `;
    });

  } catch (err) {
    console.error("Error:", err);
  }
}

loadFaculty();
</script>

<script src="../js/script.js"></script>
<script src="../js/sidebar-loader.js"></script>

</body>
</html>
