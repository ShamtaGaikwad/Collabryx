<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Collabryx · Teacher Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-brand .logo-text {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
      margin-bottom: 6px;
    }
    .login-brand p { color: #94a3b8; font-size: 13px; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="form-box">

      <div class="login-brand">
        <span class="logo-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none" height="26" style="vertical-align:middle"><line x1="8" y1="18" x2="20" y2="8" stroke="url(#lg5)" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="18" x2="20" y2="28" stroke="url(#lg5)" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="8" x2="32" y2="18" stroke="url(#lg5)" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="28" x2="32" y2="18" stroke="url(#lg5)" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="8" x2="20" y2="28" stroke="url(#lg5)" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><circle cx="8" cy="18" r="3" fill="#a78bfa"/><circle cx="20" cy="8" r="3" fill="#818cf8"/><circle cx="20" cy="28" r="3" fill="#c084fc"/><circle cx="32" cy="18" r="3.5" fill="url(#lg5)"/><text x="42" y="23" font-family="Inter,sans-serif" font-weight="700" font-size="16" fill="url(#lg5)" letter-spacing="0.5">Collabryx</text><defs><linearGradient id="lg5" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs></svg></span>
        <p>Faculty Portal</p>
      </div>

      <div id="loginForm">
        <h2>🧑‍🏫 Teacher Login</h2>
        <form>
          <div class="form-container">
            <input type="email" id="loginEmail" placeholder="Email Address" required>
            <div class="password-box">
              <input type="password" id="loginPassword" placeholder="Password" required>
              <span class="toggle-eye" onclick="togglePassword('loginPassword')">👁️</span>
            </div>
            <button type="button" onclick="login()">Login →</button>
          </div>
        </form>
        <div class="form-toggle" id="formToggle">
          Don't have an account? <a onclick="toggleForms()">Register</a>
        </div>
      </div>

      <div id="registerForm">
        <h2>📝 Teacher Register</h2>
        <form>
          <div class="form-container">
            <input type="text" id="registerName" placeholder="Full Name" required>
            <input type="email" id="registerEmail" placeholder="Email Address" required>
            <input type="text" id="registerEnrollment" placeholder="Faculty ID (8-12 digits)" required>
            <div class="password-box">
              <input type="password" id="registerPassword" placeholder="Password" required>
              <span class="toggle-eye" onclick="togglePassword('registerPassword')">👁️</span>
            </div>
            <input type="hidden" id="registerRole" value="faculty">
            <button type="button" onclick="register()">Create Account →</button>
          </div>
        </form>
        <div class="form-toggle" id="formToggle">
          Already have an account? <a onclick="toggleForms()">Login</a>
        </div>
      </div>

      <div style="text-align:center; margin-top:20px;">
        <a href="./login-role.html" class="back-link">← Back to role selection</a>
      </div>

    </div>
  </div>

  <script src="../js/script.js"></script>
</body>
</html>
